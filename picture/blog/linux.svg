    @media (prefers-color-scheme: dark) {
      :root { --ink: #d7e4d5; --muted: #7e9a87; --paper: #203027; --soft: #28403c; --green: #98be88; --teal: #92c6bc; --warm: #e0b576; --penguin: #14231b; --white: #d7e4d5; }
    }
  </style>
