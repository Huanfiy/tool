    @media (prefers-color-scheme: dark) {
      :root { --ink: #d7e4d5; --muted: #7e9a87; --paper: #203027; --soft: #3d392b; --green: #98be88; --teal: #92c6bc; --warm: #e0b576; }
    }
  </style>
  <ellipse cx="240" cy="160" rx="139" ry="110" fill="var(--soft)"/>
