    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme || (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (error) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
            document.documentElement.classList.add('js');
        })();
    </script>

                    <!-- 无边框显示器 -->

                        <g class="lift">

                                <text x="918" y="452" font-size="15" fill="#10140e" text-anchor="middle" font-weight="800" class="mono">&gt;_</text>
                                <rect x="982" y="428" width="36" height="36" rx="10" fill="#6fd8e2" class="ink-thin"/>
                                <path d="M990 456 l8 -10 6 7 5 -5 9 8 Z" fill="#10140e"/>
                                <circle cx="1008" cy="438" r="3" fill="#10140e"/>
                                <rect x="1064" y="428" width="36" height="36" rx="10" fill="#b39aec" class="ink-thin"/>

                                <circle cx="1078" cy="446" r="2.2" fill="#b39aec"/>

                                <text id="screen-hint" x="1000" y="400" font-size="14" fill="#eef7ee" text-anchor="middle">点击进入</text>

                                <polygon points="700,167.5 900,167.5 700,380" fill="url(#g-glass)"/>
                                <polygon points="960,167.5 1010,167.5 780,505 740,505" fill="#ffffff" opacity="0.035"/>
                            </g>
                            <rect id="screen-glass" x="700" y="167.5" width="600" height="337.5" rx="8" fill="none" stroke="var(--st-ink)" stroke-width="1.6"/>
                        </g>
                    </g>

                    <!-- 键盘 + 鼠标 -->
                    <g id="keyboard" class="hotspot no-lift" data-id="keyboard" role="button" tabindex="0" aria-label="机械键盘，点击去练习键位"
                       data-tip-title="机械键盘" data-tip="75% 配列，静音线性轴。盲打是靠刻意练习磕出来的。" data-tip-action="点击去练习键位 →">
                        <g class="lift">
                            <rect id="keyboard-glow" x="800" y="546" width="400" height="8" fill="url(#g-rgb)" filter="url(#f-blur6)" class="fx"/>
                            <polygon points="822,533 1178,533 1190,548 810,548" fill="var(--st-metal-3)" class="ink"/>
                            <g fill="var(--st-plastic)" stroke="var(--st-ink)" stroke-width="0.6" stroke-dasharray="6 1.6">
                                <rect class="key-row" x="827" y="535" width="346" height="2.4" rx="0.8"/>
                                <rect class="key-row" x="825" y="538.4" width="350" height="2.4" rx="0.8"/>
                                <rect class="key-row" x="822" y="541.8" width="356" height="2.4" rx="0.8"/>
                                <rect class="key-row" x="819" y="545.2" width="362" height="2.2" rx="0.8"/>
                            </g>
                            <ellipse cx="1262" cy="541" rx="13" ry="17" fill="var(--st-plastic)" class="ink" transform="rotate(-8 1262 541)"/>
                            <line x1="1263" y1="526" x2="1262" y2="536" class="ink-thin" opacity="0.6"/>
                        </g>
                    </g>

                    <!-- 小黑 -->
                    <g id="cat" class="hotspot no-lift" data-id="cat" role="button" tabindex="0" aria-label="小黑，点击逗它"
                       data-tip-title="小黑" data-tip="工作室监工，主要工作是踩键盘和挡住显示器。" data-tip-action="点击逗它">
                        <g class="lift">
                            <g transform="translate(1300 400) scale(0.92)">
                                <path class="cat-tail" d="M112 102 C 138 100 146 76 132 62" fill="none" stroke="var(--st-cat)" stroke-width="11" stroke-linecap="round"/>
                                <ellipse cx="78" cy="96" rx="36" ry="26" fill="var(--st-cat)"/>
                                <ellipse cx="64" cy="118" rx="9" ry="6" fill="var(--st-cat)"/>
                                <ellipse cx="92" cy="118" rx="9" ry="6" fill="var(--st-cat)"/>
                                <path class="cat-ear-l" d="M52 28 L44 2 L67 16 Z" fill="var(--st-cat)"/>
                                <path class="cat-ear-r" d="M96 28 L104 2 L81 16 Z" fill="var(--st-cat)"/>
                                <circle cx="74" cy="46" r="31" fill="var(--st-cat)"/>
                                <g class="cat-eyes">
                                    <ellipse cx="63" cy="46" rx="4.5" ry="6.5" fill="#8fe3d9"/>
                                    <ellipse cx="85" cy="46" rx="4.5" ry="6.5" fill="#8fe3d9"/>
                                    <circle cx="64.5" cy="43.5" r="1.5" fill="#ffffff"/>
                                    <circle cx="86.5" cy="43.5" r="1.5" fill="#ffffff"/>
                                </g>
                                <path d="M69 57 q5 4 10 0" fill="none" stroke="#8fe3d9" stroke-width="1.8" stroke-linecap="round"/>
                                <g fill="none" stroke="#8fe3d9" stroke-width="1.5" stroke-linecap="round" opacity="0.5">
                                    <path d="M36 46 q10 1 16 1"/><path d="M37 54 q9 -1 15 -2"/>
                                    <path d="M112 46 q-10 1 -16 1"/><path d="M111 54 q-9 -1 -15 -2"/>
                                </g>
                            </g>
                            <g id="cat-bubble">
                                <rect x="1322" y="350" width="96" height="32" rx="14" fill="var(--st-paper)" class="ink"/>
                                <polygon points="1360,381 1372,381 1364,393" fill="var(--st-paper)" class="ink-thin"/>
                                <line x1="1361" y1="380" x2="1371" y2="380" stroke="var(--st-paper)" stroke-width="3"/>
                                <text id="cat-bubble-text" x="1370" y="372" font-size="16" font-weight="700" fill="var(--st-ink)" text-anchor="middle">喵～</text>
                            </g>
                        </g>
                    </g>
                </g>

                <!-- ================= 窗光 ================= -->
                <g class="fx">
                    <g id="sun-rays">
                        <polygon points="448,190 448,330 1250,900 950,900" fill="url(#g-sun)" filter="url(#f-blur6)"/>
                        <polygon points="448,350 448,456 900,900 640,900" fill="url(#g-sun)" filter="url(#f-blur6)" opacity="0.75"/>
                        <polygon points="620,720 830,690 1130,900 760,900" fill="var(--st-sun-floor)" filter="url(#f-blur14)"/>
                    </g>
                    <g id="moon-rays">
                        <polygon points="448,190 448,330 1250,900 950,900" fill="url(#g-moon)" filter="url(#f-blur6)"/>
                    </g>
                </g>
            </svg>
        </div>

        <!-- 悬停说明卡 -->
        <div class="studio-tip" id="studio-tip" role="tooltip" aria-hidden="true">
            <b class="tip-title"></b>
            <span class="tip-text"></span>
            <span class="tip-action"></span>
        </div>

        <!-- 引导 -->
        <div class="studio-hint" id="studio-hint" aria-hidden="true">
            <i class="fas fa-hand-pointer"></i>悬停查看物品<span class="sep">·</span><i class="fas fa-desktop"></i>点击显示器进入系统
        </div>

        <!-- 显示器聚焦：遮罩 + huanfly-os -->
        <div class="mf-dim" id="mf-dim"></div>
        <div class="monitor-focus" id="monitor-focus">
            <div class="mf-screen" id="mf-screen" role="dialog" aria-modal="true" aria-label="huanfly-os">
                <div class="os">
                    <div class="os-topbar">
                        <span class="os-brand"><img src="picture/icon.png" alt="">huanfly-os</span>
                        <span class="os-title" id="os-title">桌面</span>
                        <span class="os-status">
                            <button class="os-btn" id="os-home" title="回到桌面" aria-label="回到桌面"><i class="fas fa-house"></i></button>
                            <i class="fas fa-wifi" aria-hidden="true"></i>
                            <i class="fas fa-battery-three-quarters" aria-hidden="true"></i>
                            <span id="os-clock">--:--</span>
                        </span>
                    </div>

                    <div class="os-body">
                        <!-- 桌面 -->
                        <section class="os-app os-desktop active" data-app="desktop" aria-label="桌面">
                            <div class="os-clock">
                                <div class="time" id="os-time">--:--</div>
                                <div class="date" id="os-date"></div>
                                <div class="greet" id="os-greet"></div>
                            </div>
                            <nav class="os-dock" aria-label="应用">
                                <button class="os-dock-item terminal" data-open="terminal">
                                    <span class="icon"><i class="fas fa-terminal"></i></span>终端
                                </button>
                                <button class="os-dock-item album" data-open="album">
                                    <span class="icon"><i class="fas fa-images"></i></span>相册
                                </button>
                                <button class="os-dock-item robot" data-open="robot">
                                    <span class="icon"><i class="fas fa-robot"></i></span>Robot
                                </button>
                            </nav>
                        </section>

                        <!-- 终端 -->
                        <section class="os-app" data-app="terminal" aria-label="终端">
                            <div class="app-head">
                                <span class="app-name"><i class="fas fa-terminal"></i> 终端</span>
                                <span class="dot" id="term-dot"></span>
                                <span id="term-mode-label">未连接</span>
                                <span class="grow"></span>
                                <button class="os-btn" id="term-relock" title="锁定终端"><i class="fas fa-lock"></i> 锁定</button>
                            </div>
                            <div class="app-body">
                                <div class="term-lock" id="term-lock">
                                    <div class="term-lock-card">
                                        <div class="lock-icon"><i class="fas fa-lock"></i></div>
                                        <h3>huanfly@studio</h3>
                                        <div class="lock-status" id="term-status"><i class="fas fa-spinner fa-spin"></i>正在探测终端桥接…</div>
                                        <form class="term-lock-form" id="term-form" autocomplete="off">
                                            <input type="password" id="term-password" placeholder="输入密码进入真实终端" autocomplete="current-password" aria-label="终端密码" disabled>
                                            <button type="submit" class="os-btn primary" id="term-submit" disabled><i class="fas fa-arrow-right"></i></button>
                                        </form>
                                        <div class="lock-alt">
                                            或者
                                            <button type="button" class="os-btn" id="term-guest"><i class="fas fa-ghost"></i> 进入访客终端</button>
                                        </div>
                                        <div class="lock-help">
                                            真实终端需要在本机运行桥接服务：<code>STUDIO_TERM_PASSWORD=… ./run.sh term</code><br>
                                            访客终端是浏览器内的模拟 shell，随便敲敲不伤机器。
                                        </div>
                                    </div>
                                </div>
                                <div class="term-body" id="term-body"></div>
                            </div>
                        </section>

                        <!-- 相册 -->
                        <section class="os-app" data-app="album" aria-label="相册">
                            <div class="app-head">
                                <span class="app-name"><i class="fas fa-images"></i> 相册</span>
                                <span class="grow"></span>
                                <div class="album-tabs" id="album-tabs" role="tablist">
                                    <button class="os-btn primary" role="tab" data-album="photography" aria-selected="true">摄影</button>
                                    <button class="os-btn" role="tab" data-album="tech" aria-selected="false">制作</button>
                                </div>
                            </div>
                            <div class="app-body">
                                <div class="album-grid" id="album-grid"></div>
                                <div class="album-viewer" id="album-viewer" aria-hidden="true">
                                    <div class="viewer-stage">
                                        <button class="viewer-nav prev" id="album-prev" aria-label="上一张"><i class="fas fa-chevron-left"></i></button>
                                        <img id="album-viewer-img" alt="">
                                        <button class="viewer-nav next" id="album-next" aria-label="下一张"><i class="fas fa-chevron-right"></i></button>
                                    </div>
                                    <div class="viewer-caption">
                                        <span id="album-viewer-caption"></span>
                                        <small id="album-viewer-index"></small>
                                        <small>Esc 返回相册 · ← → 切换</small>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- Robot -->
                        <section class="os-app" data-app="robot" aria-label="Robot">
                            <div class="app-head">
                                <span class="app-name"><i class="fas fa-robot"></i> Robot</span>
                                <span class="dot" id="robot-dot"></span>
                                <span id="robot-model-label">未配置</span>
                                <span class="grow"></span>
                                <button class="os-btn" id="robot-clear" title="清空对话"><i class="fas fa-broom"></i> 清空</button>
                                <button class="os-btn" id="robot-settings-btn" title="设置"><i class="fas fa-gear"></i> 设置</button>
                            </div>
                            <div class="app-body">
                                <div class="robot-body">
                                    <div class="robot-messages" id="robot-messages" aria-live="polite"></div>
                                    <form class="robot-composer" id="robot-form">
                                        <textarea id="robot-input" rows="1" placeholder="和小黑聊聊…（Enter 发送，Shift+Enter 换行）" aria-label="消息"></textarea>
                                        <button type="button" class="os-btn danger" id="robot-stop" hidden><i class="fas fa-stop"></i></button>
                                        <button type="submit" class="os-btn primary" id="robot-send"><i class="fas fa-paper-plane"></i></button>
                                    </form>
                                </div>
                                <div class="robot-settings" id="robot-settings">
                                    <div class="robot-settings-card">
                                        <h3><i class="fas fa-gear"></i> Robot 设置</h3>
                                        <p class="hint">接入任意 OpenAI 兼容接口。配置只保存在当前浏览器的 localStorage，不会上传到站点。</p>
                                        <form id="robot-settings-form">
                                            <label for="robot-base">API Base URL</label>
                                            <input id="robot-base" type="url" placeholder="https://api.openai.com/v1" spellcheck="false">
                                            <label for="robot-key">API Key</label>
                                            <input id="robot-key" type="password" placeholder="sk-…" autocomplete="off" spellcheck="false">
                                            <label for="robot-model">Model</label>
                                            <div class="row">
                                                <input id="robot-model" type="text" list="robot-model-list" placeholder="gpt-4o-mini" spellcheck="false">
                                                <datalist id="robot-model-list"></datalist>
                                                <button type="button" class="os-btn" id="robot-fetch-models"><i class="fas fa-list"></i> 拉取</button>
                                            </div>
                                            <label for="robot-system">System Prompt</label>
                                            <textarea id="robot-system" rows="3"></textarea>
                                            <label class="check" for="robot-relay">
                                                <input type="checkbox" id="robot-relay">
                                                <span>通过本地桥接中转请求 <small>— 接口不支持浏览器跨域（CORS）时勾选；需在本机运行 <code>./run.sh term</code>，密钥仍只经你的浏览器与上游传递</small></span>
                                            </label>
                                            <div class="status" id="robot-settings-status"></div>
                                            <div class="actions">
                                                <button type="button" class="os-btn" id="robot-settings-cancel">取消</button>
                                                <button type="submit" class="os-btn primary">保存</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </div>
        <button class="mf-exit" id="mf-exit" type="button"><i class="fas fa-arrow-left"></i> 离开显示器 <kbd>Esc</kbd></button>
    </main>

    <script src="js/script.js"></script>
    <script src="js/studio.js"></script>
    <script src="js/studio-apps.js"></script>
</body>
</html>
