<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>博客主题 SVG 封面审核 - Huanfly</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .cover-review { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
        .review-kicker { color: var(--primary-color); font-size: .85rem; letter-spacing: .12em; }
        .cover-review h1 { margin: 8px 0; font-size: clamp(1.5rem, 4vw, 2rem); }
        .review-intro { max-width: 750px; color: var(--light-text); }
        .review-link { display: inline-block; margin-top: 12px; color: var(--primary-color); }
        .review-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; margin-top: 28px; }
        .review-card { overflow: hidden; border: 1px solid var(--line-soft); border-radius: 18px; background: var(--card-bg); }
        .review-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .review-pair figure { min-width: 0; padding: 14px 10px 8px; }
        .review-pair img { width: 100%; height: auto; aspect-ratio: 3 / 2; object-fit: contain; }
        .review-pair figcaption { text-align: center; font-size: .75rem; }
        .review-light { color-scheme: light; background: #eef3e2; color: #6d7a6e; }
        .review-dark { color-scheme: dark; background: #18231b; color: #9cab99; }
        .review-copy { padding: 16px 20px 18px; }
        .review-copy h2 { font-size: 1rem; line-height: 1.6; }
        .review-copy p { margin-top: 6px; color: var(--light-text); font-size: .85rem; }
        .review-copy code { font-size: .75rem; overflow-wrap: anywhere; color: var(--light-text); }
        .review-note { margin-top: 28px; color: var(--light-text); font-size: .9rem; }
        @media (max-width: 640px) {
            .cover-review { padding: 28px 16px; }
            .review-grid { grid-template-columns: 1fr; gap: 18px; }
        }
    </style>
</head>
<body>
    <main class="cover-review">
        <p class="review-kicker">HUANFLY / FIELD NOTES</p>
        <h1>六类主题 · 可复用 SVG 封面</h1>
        <p class="review-intro">一个主题，一张长期复用的封面。嵌入式、调试、实践、成长、感悟、Linux：表达分类本身，不绑定任何文章、工具教程或具体事件。</p>
        <a class="review-link" href="../blog.html">去博客查看实际卡片 →</a>
        <div id="review-grid" class="review-grid" aria-live="polite">正在加载封面…</div>
        <p class="review-note">新文章只需填写 tag，无需逐篇指定 cover。“实践”与“工程实践”共用一张；Linux 标签忽略大小写。左侧日间、右侧夜间，使用同一个 SVG 文件。主题封面已通过审核，旧 WebP / PNG 已清理。本页用于本地视觉回归，不进入部署产物。</p>
    </main>
    <script src="../js/blog-covers.js"></script>
    <script>
        function renderReview() {
            const themes = [...BlogCovers.themes, {
                name: '通用回退', cover: BlogCovers.defaultCover,
                description: '摊开的笔记本 · 未知分类或图片加载失败时使用',
            }];
            const grid = document.getElementById('review-grid');
            grid.replaceChildren();
            for (const item of themes) {
                const card = document.createElement('article');
                card.className = 'review-card';
                const pair = document.createElement('div');
                pair.className = 'review-pair';
                for (const [theme, label] of [['light', '日间'], ['dark', '夜间']]) {
                    const figure = document.createElement('figure');
                    figure.className = 'review-' + theme;
                    const image = document.createElement('img');
                    image.src = '../' + item.cover;
                    image.alt = item.name + '主题封面 · ' + label + '配色';
                    image.width = 480;
                    image.height = 320;
                    const caption = document.createElement('figcaption');
                    caption.textContent = label;
                    figure.append(image, caption);
                    pair.append(figure);
                }
                const copy = document.createElement('div');
                copy.className = 'review-copy';
                const title = document.createElement('h2');
                title.textContent = item.name;
                const description = document.createElement('p');
                description.textContent = item.description;
                const file = document.createElement('code');
                file.textContent = item.cover;
                copy.append(title, description, file);
                card.append(pair, copy);
                grid.append(card);
            }
        }
        try { renderReview(); }
        catch (error) { document.getElementById('review-grid').textContent = error.message; }
    </script>
</body>
</html>
