<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function () {
            try {
                const savedTheme = localStorage.getItem('theme');
                const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                const theme = savedTheme || (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
            } catch (error) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
            document.documentElement.classList.add('js');
        })();
    </script>
    <title>博客 - Huanfly</title>
    <meta name="description" content="Huanfly 的技术博客：嵌入式开发、调试方法论、工程实践与成长复盘。">
    <meta name="author" content="Huanfly">
    <link rel="canonical" href="https://huanfly.com/blog.html">
    <meta property="og:type" content="website">
    <meta property="og:title" content="博客 - Huanfly">
    <meta property="og:description" content="嵌入式开发、调试方法论、工程实践与成长复盘。">
    <meta property="og:url" content="https://huanfly.com/blog.html">
    <meta property="og:site_name" content="Huanfly的空间">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:image" content="https://huanfly.com/picture/icon-512.png">
    <meta name="twitter:card" content="summary">
    <meta name="theme-color" content="#5da844">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/png" href="picture/icon.png">
    <link rel="apple-touch-icon" href="picture/icon-192.png">
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaigbscreen.css" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaiscreen.css" media="print" onload="this.media='all'">
    <noscript>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaigbscreen.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-screen-webfont@1.7.0/lxgwwenkaiscreen.css">
    </noscript>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Marked.js 用于解析 Markdown (主CDN + 备用CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/marked@4.0.12/marked.min.js"></script>
    <script>
        // 如果主 CDN 加载失败，尝试备用 CDN
        if (typeof marked === 'undefined') {
            document.write('<script src="https://unpkg.com/marked@4.0.12/marked.min.js"><\/script>');
        }
    </script>
    <script>
        // 二次检查，如果仍然失败，尝试 cdnjs
        if (typeof marked === 'undefined') {
            document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.12/marked.min.js"><\/script>');
        }
    </script>
</head>
<body>

    <header>
        <div class="container">
            <a href="index.html" class="logo">
                <img src="picture/icon.png" alt="Logo">
                <span>Huanfly</span>
            </a>
            <button type="button" class="menu-toggle" aria-label="打开菜单" aria-expanded="false" aria-controls="site-nav"><i class="fas fa-bars"></i></button>
            <nav class="nav-links" id="site-nav">
                <a href="index.html">主页</a>
                <a href="blog.html" class="active">博客</a>
                <a href="tool.html">工具</a>
                <a href="studio.html">工作室</a>
                <a href="about.html">关于</a>
                <button class="theme-toggle" aria-label="切换主题" title="切换主题">
                    <i class="fas fa-moon"></i>
                </button>
            </nav>
        </div>
    </header>

    <!-- 列表展示区域 -->
    <main id="blog-list-view" class="container page">
        <h2 class="section-title" data-reveal>最新文章</h2>

        <div class="blog-toolbar" data-reveal>
            <div class="blog-search">
                <i class="fas fa-search"></i>
                <input type="search" id="blog-search-input" placeholder="搜索文章标题、简介或标签…" aria-label="搜索文章" autocomplete="off">
            </div>
            <!-- 标签筛选：由 JS 根据 posts.json 动态生成 -->
            <div class="filter-chips" id="blog-filter-chips" role="group" aria-label="按标签筛选"></div>
        </div>

        <div class="blog-list" id="blog-cards-grid">
            <!-- 文章卡片由 JS 从 posts.json 动态渲染 -->
            <div class="loading-block">
                <i class="fas fa-spinner fa-spin fa-2x"></i>
                <p>加载文章列表...</p>
            </div>
        </div>
    </main>

    <!-- 文章详情阅读区域 (默认隐藏) -->
    <div id="blog-detail-view" class="container page" style="display: none;">
        <button onclick="closeMarkdown()" class="btn btn-outline btn-back">
            <i class="fas fa-arrow-left"></i> 返回列表
        </button>
        <article id="markdown-content" class="markdown-body">
            <!-- Markdown 内容将渲染在这里 -->
        </article>
        <!-- 评论区：giscus 配置就绪后自动渲染 -->
        <section id="article-comments" class="article-comments"></section>
    </div>

    <footer>
        <div class="container">
            <p class="footer-note">&copy; 2026 Huanfly. 保留所有权利。</p>
            <p class="footer-note site-stats" id="site-stats">
                <span title="独立访客"><i class="fas fa-paw"></i> 访客 <span id="busuanzi_value_site_uv"></span></span>
                <span aria-hidden="true">·</span>
                <span title="总浏览量"><i class="far fa-eye"></i> 浏览 <span id="busuanzi_value_site_pv"></span></span>
            </p>
            <p class="footer-note"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">粤ICP备2025388790号</a></p>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script src="js/blog-covers.js"></script>
    <script>
        // === 分类封面：同一主题的不同文章复用同一个 SVG ===
        const { defaultCover: DEFAULT_COVER, getCoverUrl, getCoverAlt } = BlogCovers;

        function handleCoverError(image) {
            // 回退图本身失败时不重试，避免形成请求循环。
            image.onerror = null;
            image.className = 'illustrated';
            image.alt = '通用笔记封面';
            image.src = DEFAULT_COVER;
        }

        // === 动态渲染文章卡片 ===
        function renderBlogCards(posts) {
            const grid = document.getElementById('blog-cards-grid');
            if (!posts.length) {
                grid.innerHTML = '<div class="loading-block"><i class="far fa-folder-open fa-2x"></i><p>没有找到相关文章</p></div>';
                return;
            }
            grid.innerHTML = posts.map((post, i) => `
                <a class="card blog-card" data-reveal style="--rise-delay: ${Math.min(i, 4) * 80}ms"
                   href="#post=${encodeURIComponent(post.file)}">
                    <div class="blog-thumb">
                        <img src="${getCoverUrl(post)}" alt="${getCoverAlt(post)}"
                             class="${getCoverUrl(post).startsWith('picture/blog/') ? 'illustrated' : post.coverFit === 'contain' ? 'contain' : ''}"
                             width="480" height="320" loading="${i < 3 ? 'eager' : 'lazy'}" decoding="async"
                             onerror="handleCoverError(this)">
                    </div>
                    <div class="blog-card-body">
                        <div class="blog-meta">
                            <span><i class="far fa-calendar"></i> ${post.date}</span>
                            ${post.tag ? `<span class="blog-tag">${post.tag}</span>` : ''}
                        </div>
                        <h3 class="blog-title">${post.title}</h3>
                        <p class="blog-summary">${post.summary || ''}</p>
                        <div class="blog-readmore">阅读全文</div>
                    </div>
                </a>
            `).join('');
            observeReveal(grid);
        }

        let allPosts = [];
        let activeTag = '全部';

        // === 标签筛选 + 搜索 联动 ===
        function applyFilters() {
            const keyword = document.getElementById('blog-search-input').value.toLowerCase();
            const filtered = allPosts.filter(post =>
                (activeTag === '全部' || post.tag === activeTag) &&
                ((post.title && post.title.toLowerCase().includes(keyword)) ||
                 (post.tag && post.tag.toLowerCase().includes(keyword)) ||
                 (post.summary && post.summary.toLowerCase().includes(keyword)) ||
                 !keyword)
            );
            renderBlogCards(filtered);
        }

        function renderFilterChips(posts) {
            const tags = ['全部', ...new Set(posts.map(p => p.tag).filter(Boolean))];
            const box = document.getElementById('blog-filter-chips');
            box.innerHTML = tags.map(tag =>
                `<button class="filter-chip${tag === activeTag ? ' active' : ''}" data-tag="${tag}">${tag}</button>`
            ).join('');
            box.querySelectorAll('.filter-chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    activeTag = chip.dataset.tag;
                    box.querySelectorAll('.filter-chip').forEach(c => c.classList.toggle('active', c === chip));
                    applyFilters();
                });
            });
        }

        // 页面加载时拉取文章清单
        fetch('posts/posts.json')
            .then(r => { if (!r.ok) throw new Error('加载失败'); return r.json(); })
            .then(posts => {
                allPosts = posts;
                renderFilterChips(posts);
                renderBlogCards(posts);
            })
            .catch(() => {
                document.getElementById('blog-cards-grid').innerHTML =
                    '<div class="error-block"><i class="fas fa-exclamation-triangle fa-2x"></i><p>文章列表加载失败，请刷新重试</p></div>';
            });

        // === Hash 路由：文章可直链分享，浏览器后退可返回列表 ===
        function openPost(file) {
            location.hash = 'post=' + encodeURIComponent(file);
        }

        function handleHashRoute() {
            const match = location.hash.match(/^#post=(.+)$/);
            if (match) {
                loadMarkdown(decodeURIComponent(match[1]));
            } else {
                document.getElementById('blog-detail-view').style.display = 'none';
                document.getElementById('blog-list-view').style.display = 'block';
            }
        }

        window.addEventListener('hashchange', handleHashRoute);
        if (location.hash.startsWith('#post=')) handleHashRoute();

        // 搜索功能
        document.getElementById('blog-search-input').addEventListener('input', applyFilters);

        // === 解析 Front Matter：返回 { meta, body } ===
        function parseFrontMatter(text) {
            if (!text.startsWith('---')) return { meta: {}, body: text };
            const end = text.indexOf('\n---', 3);
            if (end === -1) return { meta: {}, body: text };
            const meta = {};
            text.substring(3, end).split('\n').forEach(line => {
                const idx = line.indexOf(':');
                if (idx > 0) meta[line.slice(0, idx).trim()] = line.slice(idx + 1).trim();
            });
            return { meta, body: text.substring(end + 4).trimStart() };
        }

        // === 字数统计：中文按字、英文数字按词 ===
        function countWords(text) {
            const cjk = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
            const latin = (text.match(/[a-zA-Z0-9]+/g) || []).length;
            return cjk + latin;
        }

        // === 构建文章元信息头 + AI 摘要卡片 ===
        function buildArticleHead(meta, body) {
            const words = countWords(body);
            const mins = Math.max(1, Math.round(words / 400));
            const parts = [];
            if (meta.date) parts.push(`<span><i class="far fa-calendar"></i> ${meta.date}</span>`);
            if (meta.tag) parts.push(`<span class="blog-tag">${meta.tag}</span>`);
            parts.push(`<span><i class="far fa-file-lines"></i> 约 ${words} 字</span>`);
            parts.push(`<span><i class="far fa-clock"></i> 阅读约 ${mins} 分钟</span>`);
            let html = `<div class="article-meta">${parts.join('')}</div>`;
            if (meta.ai_summary) {
                html += `<aside class="ai-summary">
                    <div class="ai-summary-label"><i class="fas fa-wand-magic-sparkles"></i> AI 摘要</div>
                    <p>${meta.ai_summary}</p>
                </aside>`;
            }
            return html;
        }

        // === 加载并渲染 Markdown 文章 ===
        function loadMarkdown(file) {
            const contentDiv = document.getElementById('markdown-content');
            contentDiv.innerHTML = '<div class="loading-block"><i class="fas fa-spinner fa-spin fa-2x"></i><p>加载中...</p></div>';

            document.getElementById('blog-list-view').style.display = 'none';
            document.getElementById('blog-detail-view').style.display = 'block';
            window.scrollTo(0, 0);

            if (typeof marked === 'undefined') {
                contentDiv.innerHTML = `<div class="error-block">
                    <i class="fas fa-exclamation-triangle fa-2x"></i>
                    <p>Markdown 解析库加载失败</p>
                    <p style="font-size:0.9rem;">请检查网络连接后刷新页面</p>
                </div>`;
                return;
            }

            fetch(file)
                .then(response => {
                    if (!response.ok) throw new Error('文章加载失败');
                    return response.text();
                })
                .then(text => {
                    const { meta, body } = parseFrontMatter(text);
                    contentDiv.innerHTML = marked.parse(body);
                    // 元信息头插在正文 H1 之后（无 H1 则置顶）
                    const head = document.createElement('div');
                    head.className = 'article-head';
                    head.innerHTML = buildArticleHead(meta, body);
                    const h1 = contentDiv.querySelector('h1');
                    if (h1) h1.after(head); else contentDiv.prepend(head);
                    loadComments(file);
                })
                .catch(error => {
                    contentDiv.innerHTML = `<div class="error-block">
                        <i class="fas fa-exclamation-triangle"></i> 文章加载出错: ${error.message}
                    </div>`;
                });
        }

        // === giscus 评论（基于 GitHub Discussions） ===
        // 启用步骤：仓库开启 Discussions → 安装 giscus App（github.com/apps/giscus）
        //           → 在 giscus.app 选择分类，把 categoryId 填到下方即可生效
        const GISCUS_CONFIG = {
            repo: 'Huanfiy/huanfiy.github.io',
            repoId: 'R_kgDOM3iQ0Q',
            category: 'Announcements',
            categoryId: ''   // 留空 = 评论区不渲染
        };

        function loadComments(file) {
            const box = document.getElementById('article-comments');
            box.innerHTML = '';
            if (!GISCUS_CONFIG.categoryId) return;
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark_dimmed' : 'light';
            const s = document.createElement('script');
            s.src = 'https://giscus.app/client.js';
            s.async = true;
            s.crossOrigin = 'anonymous';
            const attrs = {
                'data-repo': GISCUS_CONFIG.repo,
                'data-repo-id': GISCUS_CONFIG.repoId,
                'data-category': GISCUS_CONFIG.category,
                'data-category-id': GISCUS_CONFIG.categoryId,
                'data-mapping': 'specific',
                'data-term': file,
                'data-strict': '0',
                'data-reactions-enabled': '1',
                'data-emit-metadata': '0',
                'data-input-position': 'top',
                'data-theme': theme,
                'data-lang': 'zh-CN',
                'data-loading': 'lazy'
            };
            Object.entries(attrs).forEach(([k, v]) => s.setAttribute(k, v));
            box.appendChild(s);
        }

        // 主题切换时同步 giscus 配色
        new MutationObserver(() => {
            const iframe = document.querySelector('iframe.giscus-frame');
            if (!iframe) return;
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark_dimmed' : 'light';
            iframe.contentWindow.postMessage({ giscus: { setConfig: { theme } } }, 'https://giscus.app');
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        function closeMarkdown() {
            // pushState 清空 hash 不触发 hashchange，视图在下方手动切回
            history.pushState('', document.title, location.pathname + location.search);
            document.getElementById('blog-detail-view').style.display = 'none';
            document.getElementById('blog-list-view').style.display = 'block';
        }
    </script>
</body>
</html>
